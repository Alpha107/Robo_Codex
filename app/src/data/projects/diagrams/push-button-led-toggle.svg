<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <rect x="30" y="90" width="170" height="140" rx="10" fill="#2f6fae" stroke="#1a1d23" stroke-width="2"/>
  <text x="115" y="155" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Arduino</text>
  <text x="115" y="176" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Uno</text>

  <!-- ground rail (single vertical line on the right, both branches join it) -->
  <line x1="460" y1="110" x2="460" y2="230" stroke="#1a1d23" stroke-width="3"/>

  <!-- Button branch (top) -->
  <line x1="200" y1="120" x2="230" y2="120" stroke="#1a1d23" stroke-width="3"/>
  <circle cx="200" cy="120" r="4" fill="#1a1d23"/>
  <text x="185" y="113" text-anchor="end" font-size="12" font-weight="600" fill="#1a1d23">D2</text>
  <path d="M230,120 H280" stroke="#4dabf7" stroke-width="3" fill="none"/>
  <rect x="280" y="105" width="60" height="30" rx="4" fill="#adb5bd" stroke="#1a1d23" stroke-width="2"/>
  <text x="310" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1d23">SW</text>
  <path d="M340,120 H460" stroke="#1a1d23" stroke-width="3" fill="none"/>
  <circle cx="460" cy="120" r="4" fill="#1a1d23"/>
  <text x="352" y="108" font-size="11" fill="#5b6270">other leg &#8594; GND</text>
  <text x="352" y="140" font-size="11" fill="#5b6270">(reads LOW when pressed,</text>
  <text x="352" y="154" font-size="11" fill="#5b6270">using INPUT_PULLUP)</text>

  <!-- LED branch (bottom) -->
  <line x1="200" y1="200" x2="230" y2="200" stroke="#1a1d23" stroke-width="3"/>
  <circle cx="200" cy="200" r="4" fill="#1a1d23"/>
  <text x="185" y="193" text-anchor="end" font-size="12" font-weight="600" fill="#1a1d23">D13</text>
  <path d="M230,200 H255" stroke="#4dabf7" stroke-width="3" fill="none"/>
  <path d="M255,200 l7,-10 l10,20 l10,-20 l10,20 l7,-10" fill="none" stroke="#1a1d23" stroke-width="3" stroke-linejoin="round"/>
  <path d="M299,200 H330" stroke="#4dabf7" stroke-width="3" fill="none"/>
  <polygon points="330,186 330,214 360,200" fill="#ff922b" stroke="#1a1d23" stroke-width="2"/>
  <line x1="360" y1="186" x2="360" y2="214" stroke="#1a1d23" stroke-width="4"/>
  <text x="345" y="234" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1d23">LED</text>
  <path d="M360,200 H460" stroke="#1a1d23" stroke-width="3" fill="none"/>
  <circle cx="460" cy="200" r="4" fill="#1a1d23"/>

  <!-- ground rail back to Arduino -->
  <path d="M460,230 H200" stroke="#1a1d23" stroke-width="3" fill="none"/>
  <circle cx="200" cy="230" r="4" fill="#1a1d23"/>
  <text x="185" y="234" text-anchor="end" font-size="12" font-weight="600" fill="#1a1d23">GND</text>

  <line x1="440" y1="260" x2="470" y2="260" stroke="#4dabf7" stroke-width="3"/>
  <text x="478" y="265" fill="#5b6270" font-size="12">signal</text>
  <line x1="440" y1="282" x2="470" y2="282" stroke="#1a1d23" stroke-width="3"/>
  <text x="478" y="287" fill="#5b6270" font-size="12">ground</text>
</svg>
