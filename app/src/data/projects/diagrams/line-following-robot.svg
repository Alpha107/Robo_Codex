<svg viewBox="0 0 820 480" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <!-- IR Sensor Array -->
  <rect x="40" y="30" width="220" height="70" rx="8" fill="#2f9e44" stroke="#1a1d23" stroke-width="2"/>
  <text x="150" y="60" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">IR Line Sensor</text>
  <text x="150" y="78" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Array</text>

  <!-- Arduino Uno -->
  <rect x="40" y="190" width="200" height="160" rx="10" fill="#2f6fae" stroke="#1a1d23" stroke-width="2"/>
  <text x="140" y="265" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Arduino</text>
  <text x="140" y="286" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Uno</text>

  <!-- L298N -->
  <rect x="360" y="190" width="180" height="160" rx="10" fill="#495057" stroke="#1a1d23" stroke-width="2"/>
  <text x="450" y="260" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">L298N</text>
  <text x="450" y="280" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Motor Driver</text>

  <!-- Left Motor -->
  <rect x="630" y="150" width="150" height="70" rx="8" fill="#e8590c" stroke="#1a1d23" stroke-width="2"/>
  <text x="705" y="191" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Left Motor</text>

  <!-- Right Motor -->
  <rect x="630" y="300" width="150" height="70" rx="8" fill="#e8590c" stroke="#1a1d23" stroke-width="2"/>
  <text x="705" y="341" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Right Motor</text>

  <!-- Battery -->
  <rect x="360" y="400" width="180" height="60" rx="8" fill="#c92a2a" stroke="#1a1d23" stroke-width="2"/>
  <text x="450" y="435" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Battery (6&#8211;12V)</text>

  <!-- IR array -> Arduino -->
  <path d="M150,100 V190" fill="none" stroke="#4dabf7" stroke-width="3"/>
  <circle cx="150" cy="100" r="4" fill="#4dabf7"/>
  <text x="160" y="150" fill="#1a1d23" font-size="12" font-weight="600">OUT1/OUT3/OUT5</text>
  <text x="160" y="166" fill="#1a1d23" font-size="12" font-weight="600">&#8594; D2 / D3 / D4</text>

  <!-- Arduino -> L298N -->
  <path d="M240,270 H360" fill="none" stroke="#4dabf7" stroke-width="3"/>
  <circle cx="240" cy="270" r="4" fill="#4dabf7"/>
  <text x="250" y="262" fill="#1a1d23" font-size="11" font-weight="600">IN1-4, ENA, ENB</text>
  <text x="152" y="375" fill="#5b6270" font-size="11">D8&#8211;D11 = direction</text>
  <text x="152" y="391" fill="#5b6270" font-size="11">D5/D6 = speed (PWM)</text>

  <!-- L298N -> Left Motor -->
  <path d="M540,225 H630" fill="none" stroke="#e8590c" stroke-width="3"/>
  <text x="548" y="217" fill="#1a1d23" font-size="12" font-weight="600">OUT1, OUT2</text>

  <!-- L298N -> Right Motor -->
  <path d="M540,325 H630" fill="none" stroke="#e8590c" stroke-width="3"/>
  <text x="548" y="317" fill="#1a1d23" font-size="12" font-weight="600">OUT3, OUT4</text>

  <!-- Battery -> L298N (+12V) -->
  <path d="M430,400 V350" fill="none" stroke="#c92a2a" stroke-width="3"/>
  <text x="345" y="380" text-anchor="end" fill="#1a1d23" font-size="12" font-weight="600">+12V</text>

  <!-- Common ground: Arduino - L298N - Battery -->
  <path d="M140,350 V430 H360" fill="none" stroke="#1a1d23" stroke-width="3"/>
  <path d="M470,400 V350" fill="none" stroke="#1a1d23" stroke-width="3"/>
  <text x="150" y="430" fill="#1a1d23" font-size="12" font-weight="700">common GND (required!)</text>

  <!-- legend -->
  <line x1="600" y1="420" x2="630" y2="420" stroke="#4dabf7" stroke-width="3"/>
  <text x="638" y="425" fill="#5b6270" font-size="12">signal</text>
  <line x1="600" y1="442" x2="630" y2="442" stroke="#e8590c" stroke-width="3"/>
  <text x="638" y="447" fill="#5b6270" font-size="12">motor power</text>
  <line x1="600" y1="464" x2="630" y2="464" stroke="#1a1d23" stroke-width="3"/>
  <text x="638" y="469" fill="#5b6270" font-size="12">ground</text>
</svg>
