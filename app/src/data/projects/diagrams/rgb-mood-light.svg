  <text x="280" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1d23">GND &#8594; GND</text>

  <text x="280" y="222" text-anchor="middle" fill="#5b6270" font-size="11">Longer strips (~8+ LEDs): power from a separate 5V supply,</text>
  <text x="280" y="238" text-anchor="middle" fill="#5b6270" font-size="11">sharing only GND with the Arduino.</text>
