<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <!-- Remote container -->
  <rect x="20" y="20" width="330" height="380" rx="12" fill="none" stroke="#1a1d23" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="185" y="45" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1d23">REMOTE (transmitter)</text>

  <rect x="50" y="70" width="130" height="60" rx="8" fill="#845ef7" stroke="#1a1d23" stroke-width="2"/>
  <text x="115" y="105" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Joystick</text>

  <rect x="50" y="290" width="270" height="80" rx="10" fill="#2f6fae" stroke="#1a1d23" stroke-width="2"/>
  <text x="185" y="325" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Arduino Uno #1</text>
  <text x="185" y="345" text-anchor="middle" fill="#ffffff" font-size="12">(remote)</text>

  <rect x="220" y="70" width="130" height="60" rx="8" fill="#f08c00" stroke="#1a1d23" stroke-width="2"/>
  <text x="285" y="97" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">RF433</text>
  <text x="285" y="113" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">TX</text>

  <path d="M115,130 V290" fill="none" stroke="#51cf66" stroke-width="3"/>
  <text x="122" y="200" font-size="11" font-weight="600" fill="#1a1d23">VRx/VRy &#8594; A0/A1</text>

  <path d="M285,130 V290" fill="none" stroke="#4dabf7" stroke-width="3"/>
  <text x="292" y="200" font-size="11" font-weight="600" fill="#1a1d23">DATA &#8594; D12</text>

  <!-- Car container -->
  <rect x="550" y="20" width="330" height="380" rx="12" fill="none" stroke="#1a1d23" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="715" y="45" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1d23">CAR (receiver)</text>

  <rect x="580" y="70" width="130" height="60" rx="8" fill="#f08c00" stroke="#1a1d23" stroke-width="2"/>
  <text x="645" y="97" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">RF433</text>
  <text x="645" y="113" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">RX</text>

  <rect x="580" y="160" width="130" height="70" rx="10" fill="#2f6fae" stroke="#1a1d23" stroke-width="2"/>
  <text x="645" y="192" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Arduino Uno #2</text>
  <text x="645" y="210" text-anchor="middle" fill="#ffffff" font-size="11">(car)</text>

  <rect x="740" y="160" width="120" height="70" rx="10" fill="#495057" stroke="#1a1d23" stroke-width="2"/>
  <text x="800" y="192" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">L298N</text>
  <text x="800" y="210" text-anchor="middle" fill="#ffffff" font-size="11">Motor Driver</text>

  <rect x="580" y="280" width="120" height="50" rx="8" fill="#e8590c" stroke="#1a1d23" stroke-width="2"/>
  <text x="640" y="310" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">2x Motors</text>

  <rect x="740" y="280" width="120" height="50" rx="8" fill="#c92a2a" stroke="#1a1d23" stroke-width="2"/>
  <text x="800" y="310" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Battery</text>

  <path d="M645,130 V160" fill="none" stroke="#4dabf7" stroke-width="3"/>
  <text x="652" y="150" font-size="11" font-weight="600" fill="#1a1d23">DATA &#8594; D12</text>

  <path d="M710,195 H740" fill="none" stroke="#4dabf7" stroke-width="3"/>
  <text x="648" y="242" font-size="11" font-weight="600" fill="#1a1d23">IN1-4, ENA, ENB &#8594; D2-D9</text>

  <path d="M700,290 H740" fill="none" stroke="#e8590c" stroke-width="3"/>
  <path d="M800,230 V280" fill="none" stroke="#c92a2a" stroke-width="3"/>

  <!-- RF link -->
  <path d="M350,150 L550,150" fill="none" stroke="#1a1d23" stroke-width="2" stroke-dasharray="4 6"/>
  <text x="450" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d23">433MHz RF link</text>
  <text x="450" y="170" text-anchor="middle" font-size="11" fill="#5b6270">(one-way, transmitter &#8594; receiver)</text>
</svg>
