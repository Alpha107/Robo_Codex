<svg viewBox="0 0 660 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <rect x="30" y="70" width="180" height="160" rx="10" fill="#2f6fae" stroke="#1a1d23" stroke-width="2"/>
  <text x="120" y="145" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Arduino</text>
  <text x="120" y="166" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Uno</text>

  <rect x="400" y="30" width="150" height="120" rx="8" fill="#495057" stroke="#1a1d23" stroke-width="2"/>
