<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <rect x="30" y="80" width="180" height="180" rx="10" fill="#2f6fae" stroke="#1a1d23" stroke-width="2"/>
  <text x="120" y="165" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Arduino</text>
  <text x="120" y="186" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Uno</text>

  <!-- Arduino pin stubs -->
  <line x1="210" y1="110" x2="230" y2="110" stroke="#1a1d23" stroke-width="3"/>
  <circle cx="210" cy="110" r="4" fill="#1a1d23"/>
  <text x="195" y="103" text-anchor="end" font-size="12" font-weight="600" fill="#1a1d23">A0</text>

  <line x1="210" y1="150" x2="230" y2="150" stroke="#1a1d23" stroke-width="3"/>
  <circle cx="210" cy="150" r="4" fill="#1a1d23"/>
  <text x="195" y="143" text-anchor="end" font-size="12" font-weight="600" fill="#1a1d23">GND</text>

  <line x1="210" y1="190" x2="230" y2="190" stroke="#1a1d23" stroke-width="3"/>
  <circle cx="210" cy="190" r="4" fill="#1a1d23"/>
  <text x="195" y="183" text-anchor="end" font-size="12" font-weight="600" fill="#1a1d23">D9</text>

  <!-- LDR voltage divider, vertical stack -->
  <text x="380" y="45" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1d23">5V</text>
  <line x1="380" y1="55" x2="380" y2="80" stroke="#ff6b6b" stroke-width="3"/>
  <rect x="355" y="80" width="50" height="40" rx="4" fill="#ffd43b" stroke="#1a1d23" stroke-width="2"/>
  <text x="380" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1d23">LDR</text>
  <line x1="380" y1="120" x2="380" y2="140" stroke="#1a1d23" stroke-width="3"/>
  <path d="M380,140 H230" fill="none" stroke="#51cf66" stroke-width="3"/>
  <path d="M230,140 V110" fill="none" stroke="#51cf66" stroke-width="3"/>
  <circle cx="380" cy="140" r="4" fill="#51cf66"/>
  <text x="390" y="135" font-size="12" font-weight="600" fill="#1a1d23">to A0</text>

  <line x1="380" y1="140" x2="380" y2="160" stroke="#1a1d23" stroke-width="3"/>
  <path d="M362,160 l6,10 l12,-20 l12,20 l12,-20 l12,20 l6,-10" fill="none" stroke="#1a1d23" stroke-width="3" stroke-linejoin="round"/>
  <text x="430" y="185" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1d23">10k&#8486;</text>
  <line x1="380" y1="190" x2="380" y2="220" stroke="#1a1d23" stroke-width="3"/>
  <path d="M380,220 H260 V150 H230" fill="none" stroke="#1a1d23" stroke-width="3"/>
  <text x="380" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1d23">GND</text>

  <!-- LED lamp on D9 -->
  <path d="M230,190 H450" fill="none" stroke="#4dabf7" stroke-width="3"/>
  <path d="M450,190 l7,-10 l10,20 l10,-20 l10,20 l7,-10" fill="none" stroke="#1a1d23" stroke-width="3" stroke-linejoin="round"/>
  <path d="M494,190 H520" fill="none" stroke="#4dabf7" stroke-width="3"/>
  <polygon points="520,176 520,204 550,190" fill="#ff922b" stroke="#1a1d23" stroke-width="2"/>
  <line x1="550" y1="176" x2="550" y2="204" stroke="#1a1d23" stroke-width="4"/>
  <text x="530" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1d23">LED lamp</text>
  <path d="M550,204 V280 H230 V150" fill="none" stroke="#1a1d23" stroke-width="3"/>

</svg>
