<svg viewBox="0 0 820 520" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <!-- HC-SR04 -->
  <rect x="40" y="20" width="170" height="60" rx="8" fill="#0ca678" stroke="#1a1d23" stroke-width="2"/>
  <text x="125" y="55" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">HC-SR04</text>

  <!-- Servo -->
  <rect x="230" y="20" width="150" height="60" rx="8" fill="#f08c00" stroke="#1a1d23" stroke-width="2"/>
  <text x="305" y="55" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Servo (pan)</text>

  <!-- Arduino -->
  <rect x="40" y="140" width="200" height="160" rx="10" fill="#2f6fae" stroke="#1a1d23" stroke-width="2"/>
  <text x="140" y="215" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Arduino</text>
  <text x="140" y="236" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Uno</text>

  <!-- L298N -->
  <rect x="360" y="140" width="180" height="160" rx="10" fill="#495057" stroke="#1a1d23" stroke-width="2"/>
  <text x="450" y="210" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">L298N</text>
  <text x="450" y="230" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Motor Driver</text>

  <!-- Left Motor -->
  <rect x="630" y="100" width="150" height="70" rx="8" fill="#e8590c" stroke="#1a1d23" stroke-width="2"/>
  <text x="705" y="141" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Left Motor</text>

  <!-- Right Motor -->
  <rect x="630" y="250" width="150" height="70" rx="8" fill="#e8590c" stroke="#1a1d23" stroke-width="2"/>
  <text x="705" y="291" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Right Motor</text>

  <!-- Battery -->
  <rect x="360" y="350" width="180" height="60" rx="8" fill="#c92a2a" stroke="#1a1d23" stroke-width="2"/>
  <text x="450" y="385" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Battery (6&#8211;12V)</text>

  <!-- HC-SR04 -> Arduino -->
  <path d="M125,80 V140" fill="none" stroke="#4dabf7" stroke-width="3"/>
  <circle cx="125" cy="80" r="4" fill="#4dabf7"/>
  <text x="10" y="112" fill="#1a1d23" font-size="11" font-weight="600">TRIG/ECHO</text>
  <text x="10" y="126" fill="#1a1d23" font-size="11" font-weight="600">&#8594; D7 / D6</text>

  <!-- Servo -> Arduino -->
  <path d="M305,80 V120 H235 V140" fill="none" stroke="#4dabf7" stroke-width="3"/>
  <circle cx="305" cy="80" r="4" fill="#4dabf7"/>
  <text x="315" y="105" fill="#1a1d23" font-size="11" font-weight="600">Signal &#8594; D9</text>

  <!-- Arduino -> L298N -->
  <path d="M240,220 H360" fill="none" stroke="#4dabf7" stroke-width="3"/>
  <circle cx="240" cy="220" r="4" fill="#4dabf7"/>
  <text x="250" y="212" fill="#1a1d23" font-size="11" font-weight="600">IN1-4, ENA, ENB</text>
  <text x="152" y="325" fill="#5b6270" font-size="11">D2&#8211;D5 = direction</text>
  <text x="152" y="341" fill="#5b6270" font-size="11">D10/D11 = speed (PWM)</text>

  <!-- L298N -> Left Motor -->
  <path d="M540,175 H630" fill="none" stroke="#e8590c" stroke-width="3"/>
  <text x="548" y="167" fill="#1a1d23" font-size="12" font-weight="600">OUT1, OUT2</text>

  <!-- L298N -> Right Motor -->
  <path d="M540,275 H630" fill="none" stroke="#e8590c" stroke-width="3"/>
  <text x="548" y="267" fill="#1a1d23" font-size="12" font-weight="600">OUT3, OUT4</text>

  <!-- Battery -> L298N (+12V) -->
  <path d="M430,350 V300" fill="none" stroke="#c92a2a" stroke-width="3"/>
  <text x="345" y="330" text-anchor="end" fill="#1a1d23" font-size="12" font-weight="600">+12V</text>

  <!-- Common ground -->
  <path d="M140,300 V380 H360" fill="none" stroke="#1a1d23" stroke-width="3"/>
  <path d="M470,350 V300" fill="none" stroke="#1a1d23" stroke-width="3"/>
  <text x="150" y="380" fill="#1a1d23" font-size="12" font-weight="700">common GND (required!)</text>

  <!-- legend -->
  <line x1="600" y1="370" x2="630" y2="370" stroke="#4dabf7" stroke-width="3"/>
  <text x="638" y="375" fill="#5b6270" font-size="12">signal</text>
  <line x1="600" y1="392" x2="630" y2="392" stroke="#e8590c" stroke-width="3"/>
  <text x="638" y="397" fill="#5b6270" font-size="12">motor power</text>
  <line x1="600" y1="414" x2="630" y2="414" stroke="#1a1d23" stroke-width="3"/>
  <text x="638" y="419" fill="#5b6270" font-size="12">ground</text>
</svg>
