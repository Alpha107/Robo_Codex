<svg viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <style>
    .arm { animation: swing 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 250px 150px; }
    @keyframes swing { 0%, 20% { transform: rotate(0deg); } 50%, 70% { transform: rotate(48deg); } 100% { transform: rotate(0deg); } }
    .com { animation: comslide 3.6s ease-in-out infinite; }
    @keyframes comslide {
      0%, 20% { cx: 250px; fill: #2f9e44; }
      50%, 70% { cx: 345px; fill: #e03131; }
      100% { cx: 250px; fill: #2f9e44; }
    }
  </style>

  <text x="250" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d23">Reaching Out Shifts the Center of Mass</text>

  <polygon points="150,220 350,220 330,260 170,260" fill="#e7f5ff" stroke="#4dabf7" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="250" y="285" text-anchor="middle" font-size="10.5" fill="#1c7ed6" font-weight="700">base of support (wheel contact points)</text>

  <rect x="220" y="170" width="60" height="50" rx="6" fill="#2f6fae" stroke="#1a1d23" stroke-width="2"/>
  <circle cx="160" cy="230" r="12" fill="#1a1d23"/>
  <circle cx="340" cy="230" r="12" fill="#1a1d23"/>

  <g class="arm">
    <line x1="250" y1="170" x2="250" y2="90" stroke="#5b6270" stroke-width="8" stroke-linecap="round"/>
    <circle cx="250" cy="85" r="9" fill="#f08c00"/>
  </g>

  <circle class="com" cx="250" cy="150" r="8" stroke="#1a1d23" stroke-width="1.5"/>
  <text x="250" y="140" text-anchor="middle" font-size="10" font-weight="700" fill="#5b6270">CoM</text>

  <text x="250" y="45" text-anchor="middle" font-size="10.5" fill="#5b6270">As the arm swings out, the center of mass slides toward the edge &#8212;</text>
  <text x="250" y="58" text-anchor="middle" font-size="10.5" fill="#5b6270">crossing the polygon boundary means the robot tips.</text>
</svg>
