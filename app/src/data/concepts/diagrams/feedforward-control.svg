<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <style>
    .ffflow { stroke-dasharray: 6 5; animation: ffmove 1s linear infinite; }
    @keyframes ffmove { to { stroke-dashoffset: -22; } }
    .fbflow { stroke-dasharray: 6 5; animation: fbmove 1.3s linear infinite; }
    @keyframes fbmove { to { stroke-dashoffset: -22; } }
    .sensorflow { stroke-dasharray: 6 4; animation: sensormove 1.6s linear infinite; }
    @keyframes sensormove { to { stroke-dashoffset: -20; } }
  </style>

  <text x="20" y="45" font-size="13" font-weight="700" fill="#1a1d23">Reference r(t)</text>

  <path d="M25,60 V90 H100" stroke="#f08c00" stroke-width="2.5" fill="none" class="ffflow"/>
  <polygon points="100,84 114,90 100,96" fill="#f08c00"/>
  <rect x="114" y="65" width="140" height="50" rx="7" fill="#f08c00" stroke="#1a1d23" stroke-width="2"/>
  <text x="184" y="86" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Feedforward</text>
  <text x="184" y="102" text-anchor="middle" fill="#fff3e0" font-size="10">model-based u_ff</text>
  <path d="M254,90 H400 V130" stroke="#f08c00" stroke-width="2.5" fill="none" class="ffflow"/>

  <path d="M25,60 V210 H100" stroke="#4dabf7" stroke-width="2.5" fill="none" class="fbflow"/>
  <polygon points="100,204 114,210 100,216" fill="#4dabf7"/>
  <circle cx="128" cy="210" r="14" fill="#ffffff" stroke="#1a1d23" stroke-width="2.5"/>
  <text x="128" y="206" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1d23">+</text>
  <text x="128" y="219" text-anchor="middle" font-size="11" font-weight="700" fill="#e03131">&#8722;</text>
  <path d="M142,210 H178" stroke="#4dabf7" stroke-width="2.5" fill="none" class="fbflow"/>
  <polygon points="178,204 192,210 178,216" fill="#4dabf7"/>
  <rect x="192" y="185" width="120" height="50" rx="7" fill="#4dabf7" stroke="#1a1d23" stroke-width="2"/>
  <text x="252" y="206" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Feedback</text>
  <text x="252" y="222" text-anchor="middle" fill="#e7f5ff" font-size="10">PID, u_fb</text>
  <path d="M312,210 H400 V150" stroke="#4dabf7" stroke-width="2.5" fill="none" class="fbflow"/>

  <circle cx="400" cy="145" r="15" fill="#ffffff" stroke="#1a1d23" stroke-width="2.5"/>
  <text x="400" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d23">+</text>

  <path d="M415,145 H455" stroke="#1a1d23" stroke-width="2.5" fill="none" class="ffflow"/>
  <polygon points="455,139 469,145 455,151" fill="#1a1d23"/>
  <rect x="469" y="120" width="90" height="50" rx="7" fill="#8d6e63" stroke="#1a1d23" stroke-width="2"/>
  <text x="514" y="150" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Plant</text>

  <path d="M559,145 H610" stroke="#1a1d23" stroke-width="2.5" fill="none" class="ffflow"/>
  <text x="618" y="150" font-size="13" font-weight="700" fill="#1a1d23">y(t)</text>

  <path d="M600,145 V270 H128 V224" fill="none" stroke="#51cf66" stroke-width="2.5" class="sensorflow"/>
  <polygon points="122,230 128,218 134,230" fill="#51cf66"/>
  <text x="364" y="288" text-anchor="middle" font-size="11" font-weight="600" fill="#2f9e44">only the feedback path needs a sensor measurement</text>

  <rect x="60" y="295" width="590" height="42" rx="8" fill="#f4f6f9" stroke="#dde1e8" stroke-width="1.4"/>
  <text x="355" y="313" text-anchor="middle" font-size="10" fill="#5b6270">Example: gravity compensation — u_ff = m&#183;g&#183;L&#183;cos(&#952;) holds the arm up instantly,</text>
  <text x="355" y="327" text-anchor="middle" font-size="10" fill="#5b6270">before feedback has to correct anything</text>
</svg>
