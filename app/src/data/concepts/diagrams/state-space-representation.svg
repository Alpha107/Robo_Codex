<svg viewBox="0 0 790 320" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <style>
    .fwd { stroke-dasharray: 6 5; animation: fwdflow 1s linear infinite; }
    @keyframes fwdflow { to { stroke-dashoffset: -22; } }
    .fb { stroke-dasharray: 6 4; animation: fbflow 1.4s linear infinite; }
    @keyframes fbflow { to { stroke-dashoffset: -20; } }
  </style>

  <text x="20" y="45" font-size="13" font-weight="700" fill="#1a1d23">u</text>
  <path d="M35,50 H70" stroke="#1a1d23" stroke-width="2.5" fill="none" class="fwd"/>
  <polygon points="70,44 84,50 70,56" fill="#1a1d23"/>

  <rect x="84" y="25" width="60" height="50" rx="7" fill="#2f6fae" stroke="#1a1d23" stroke-width="2"/>
  <text x="114" y="55" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">B</text>

  <path d="M144,50 H178" stroke="#1a1d23" stroke-width="2.5" fill="none" class="fwd"/>
  <polygon points="178,44 192,50 178,56" fill="#1a1d23"/>

  <circle cx="205" cy="50" r="15" fill="#ffffff" stroke="#1a1d23" stroke-width="2.5"/>
  <text x="205" y="56" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1d23">+</text>

  <path d="M220,50 H255" stroke="#1a1d23" stroke-width="2.5" fill="none" class="fwd"/>
  <polygon points="255,44 269,50 255,56" fill="#1a1d23"/>
  <text x="238" y="38" text-anchor="middle" font-size="11" fill="#5b6270">&#7819;</text>

  <rect x="269" y="25" width="70" height="50" rx="7" fill="#f08c00" stroke="#1a1d23" stroke-width="2"/>
  <text x="304" y="55" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">&#8747;</text>

  <path d="M339,50 H600" stroke="#1a1d23" stroke-width="2.5" fill="none" class="fwd"/>
  <polygon points="600,44 614,50 600,56" fill="#1a1d23"/>
  <text x="356" y="38" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d23">x</text>

  <path d="M405,50 V150 H150 V63" fill="none" stroke="#845ef7" stroke-width="2.5" class="fb"/>
  <polygon points="144,69 150,57 156,69" fill="#845ef7"/>
  <rect x="150" y="150" width="60" height="45" rx="7" fill="#845ef7" stroke="#1a1d23" stroke-width="2"/>
  <text x="180" y="178" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">A</text>
  <text x="180" y="212" text-anchor="middle" font-size="10.5" fill="#5b6270">state feeds back through A</text>

  <rect x="614" y="25" width="60" height="50" rx="7" fill="#51cf66" stroke="#1a1d23" stroke-width="2"/>
  <text x="644" y="55" text-anchor="middle" fill="#071019" font-size="15" font-weight="700">C</text>

  <path d="M674,50 H695" stroke="#1a1d23" stroke-width="2.5" fill="none" class="fwd"/>
  <text x="670" y="15" text-anchor="middle" font-size="11" fill="#5b6270">y = Cx (+ Du, often omitted)</text>
  <text x="682" y="45" font-size="13" font-weight="700" fill="#1a1d23">y</text>

  <rect x="60" y="245" width="670" height="60" rx="8" fill="#f4f6f9" stroke="#dde1e8" stroke-width="1.4"/>
  <text x="395" y="266" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1d23">Example: a wheeled robot's state vector</text>
  <text x="395" y="284" text-anchor="middle" font-size="10.5" fill="#5b6270">x = [x-position, y-position, heading, velocity] &#8212; u is the motor commands,</text>
  <text x="395" y="298" text-anchor="middle" font-size="10.5" fill="#5b6270">y is whatever a sensor (like an encoder) can actually observe of that state.</text>
</svg>
