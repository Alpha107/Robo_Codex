<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <style>
    .flow { stroke-dasharray: 6 5; animation: flowmove 1s linear infinite; }
    @keyframes flowmove { to { stroke-dashoffset: -22; } }
    .glow { animation: glowpulse 1.3s ease-in-out infinite; }
    @keyframes glowpulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
  </style>

  <text x="320" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d23">Combining Complementary Sensors</text>

  <rect x="20" y="45" width="180" height="55" rx="8" fill="#4dabf7" stroke="#1a1d23" stroke-width="2"/>
  <text x="110" y="68" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Gyroscope</text>
  <text x="110" y="84" text-anchor="middle" fill="#e7f5ff" font-size="10">fast &amp; smooth, but drifts</text>

  <rect x="20" y="112" width="180" height="55" rx="8" fill="#51cf66" stroke="#1a1d23" stroke-width="2"/>
  <text x="110" y="135" text-anchor="middle" fill="#071019" font-size="12" font-weight="700">Accelerometer</text>
  <text x="110" y="151" text-anchor="middle" fill="#08380f" font-size="10">noisy, but no long-term drift</text>

  <rect x="20" y="179" width="180" height="55" rx="8" fill="#cc5de8" stroke="#1a1d23" stroke-width="2"/>
  <text x="110" y="202" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">GPS / Magnetometer</text>
  <text x="110" y="218" text-anchor="middle" fill="#f8e6ff" font-size="10">slow, but absolute reference</text>

  <path d="M200,72 H280 V140" stroke="#1a1d23" stroke-width="2" fill="none" class="flow"/>
  <path d="M200,140 H280" stroke="#1a1d23" stroke-width="2" fill="none" class="flow"/>
  <path d="M200,206 H280 V140" stroke="#1a1d23" stroke-width="2" fill="none" class="flow"/>
  <path d="M280,140 H320" stroke="#1a1d23" stroke-width="2.5" fill="none" class="flow"/>
  <polygon points="320,134 334,140 320,146" fill="#1a1d23"/>

  <rect x="334" y="105" width="150" height="70" rx="8" fill="#f08c00" stroke="#1a1d23" stroke-width="2" class="glow"/>
  <text x="409" y="135" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Fusion</text>
  <text x="409" y="153" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Algorithm</text>

  <path d="M484,140 H540" stroke="#1a1d23" stroke-width="2.5" fill="none" class="flow"/>
  <polygon points="540,134 554,140 540,146" fill="#1a1d23"/>

  <rect x="554" y="112" width="70" height="56" rx="8" fill="#2f9e44" stroke="#1a1d23" stroke-width="2"/>
  <text x="589" y="136" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">Best</text>
  <text x="589" y="152" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">Estimate</text>

  <text x="320" y="245" text-anchor="middle" font-size="11" fill="#5b6270">Each sensor's weakness is offset by another sensor's strength.</text>
  <text x="320" y="262" text-anchor="middle" font-size="10" fill="#5b6270">Example: BNO055 fuses accel+gyro+magnetometer into one stable orientation.</text>
</svg>
