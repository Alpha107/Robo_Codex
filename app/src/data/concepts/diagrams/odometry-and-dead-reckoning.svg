<svg viewBox="0 0 680 275" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <text x="340" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d23">Odometry Drift Over Distance Traveled</text>

  <circle cx="60" cy="200" r="6" fill="#1a1d23"/>
  <text x="35" y="222" font-size="10.5" fill="#5b6270">start</text>

  <path d="M60,200 Q250,120 560,80" fill="none" stroke="#2f9e44" stroke-width="3"/>
  <text x="500" y="65" font-size="11" font-weight="700" fill="#2f9e44">true path</text>

  <path d="M60,200 Q260,150 540,150" fill="none" stroke="#e03131" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="470" y="175" font-size="11" font-weight="700" fill="#e03131">odometry estimate (drifting)</text>

  <path d="M545,145 L555,88" stroke="#5b6270" stroke-width="1.4" stroke-dasharray="3 3"/>
  <text x="565" y="118" font-size="10.5" fill="#5b6270">accumulated</text>
  <text x="565" y="131" font-size="10.5" fill="#5b6270">drift</text>

  <circle r="6" fill="#2f9e44">
    <animateMotion dur="3s" repeatCount="indefinite" path="M60,200 Q250,120 560,80"/>
  </circle>
  <circle r="6" fill="#e03131">
    <animateMotion dur="3s" repeatCount="indefinite" path="M60,200 Q260,150 540,150"/>
  </circle>

  <text x="340" y="245" text-anchor="middle" font-size="10" fill="#5b6270">Small per-step errors compound with every new update —</text>
  <text x="340" y="257" text-anchor="middle" font-size="10" fill="#5b6270">the gap grows the farther the robot travels.</text>
</svg>
