<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <text x="340" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d23">Differential Drive: Different Wheel Speeds Curve the Path</text>

  <circle cx="540" cy="230" r="4" fill="#5b6270"/>
  <path d="M540,230 L 300,150" stroke="#adb5bd" stroke-width="1.4" stroke-dasharray="3 3"/>
  <path d="M540,230 L 340,190" stroke="#adb5bd" stroke-width="1.4" stroke-dasharray="3 3"/>
  <text x="470" y="255" text-anchor="middle" font-size="10.5" fill="#5b6270">instantaneous center of</text>
  <text x="470" y="269" text-anchor="middle" font-size="10.5" fill="#5b6270">curvature (ICC)</text>

  <path d="M300,150 Q400,120 540,230" fill="none" stroke="#2f9e44" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="60" y="280" font-size="11" fill="#2f9e44" font-weight="700">robot's curved path (green)</text>

  <g>
    <animateMotion dur="4s" repeatCount="indefinite" rotate="auto" path="M300,150 Q400,120 540,230"/>
    <g transform="rotate(-25)">
      <rect x="-30" y="-18" width="60" height="36" rx="6" fill="#2f6fae" stroke="#1a1d23" stroke-width="2"/>
      <rect x="-36" y="-24" width="10" height="16" rx="2" fill="#1a1d23"/>
      <rect x="26" y="-24" width="10" height="16" rx="2" fill="#1a1d23"/>
      <rect x="-36" y="8" width="10" height="16" rx="2" fill="#1a1d23"/>
      <rect x="26" y="8" width="10" height="16" rx="2" fill="#1a1d23"/>
      <line x1="-31" y1="-16" x2="-31" y2="-24" stroke="#e03131" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" from="0 -31 -16" to="360 -31 -16" dur="0.4s" repeatCount="indefinite"/>
      </line>
      <line x1="-31" y1="16" x2="-31" y2="8" stroke="#f08c00" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" from="0 -31 16" to="360 -31 16" dur="0.9s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <text x="130" y="90" font-size="10.5" fill="#e03131" font-weight="700">left wheel (faster)</text>
  <text x="130" y="235" font-size="10.5" fill="#f08c00" font-weight="700">right wheel (slower)</text>
  <text x="230" y="70" font-size="10.5" fill="#5b6270">&#8592; track width L &#8594;</text>
</svg>
