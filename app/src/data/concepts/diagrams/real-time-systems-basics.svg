<svg viewBox="0 0 600 240" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <style>
    .growok { animation: growok 2.4s ease-in infinite; }
    @keyframes growok { 0% { width: 0px; } 55%, 100% { width: 80px; } }
    .growfail { animation: growfail 2.4s ease-in infinite; }
    @keyframes growfail { 0% { width: 0px; fill: #2f9e44; } 45% { fill: #2f9e44; } 46% { fill: #e03131; } 100% { width: 110px; fill: #e03131; } }
    .failflash { animation: failflash 2.4s steps(1) infinite; }
    @keyframes failflash { 0%, 45% { opacity: 0; } 46%, 100% { opacity: 1; } }
  </style>

  <text x="300" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d23">Hard Real-Time: The Deadline Is Absolute</text>

  <line x1="40" y1="150" x2="560" y2="150" stroke="#1a1d23" stroke-width="2"/>
  <text x="565" y="155" font-size="11" fill="#5b6270">time</text>

  <line x1="150" y1="60" x2="150" y2="150" stroke="#adb5bd" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="150" y="52" text-anchor="middle" font-size="10.5" fill="#5b6270">deadline</text>
  <rect x="60" y="120" width="80" height="20" rx="4" fill="#2f9e44" class="growok"/>
  <text x="100" y="134" text-anchor="middle" font-size="10.5" fill="#ffffff" font-weight="700">&#10003;</text>

  <line x1="420" y1="60" x2="420" y2="150" stroke="#adb5bd" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="420" y="52" text-anchor="middle" font-size="10.5" fill="#5b6270">deadline</text>
  <rect x="330" y="120" width="110" height="20" rx="4" class="growfail"/>
  <text x="450" y="134" font-size="10.5" fill="#e03131" font-weight="700" class="failflash">&#10005; too late = failure</text>

  <text x="300" y="195" text-anchor="middle" font-size="10.5" fill="#5b6270">Correct but late is treated the same as wrong, in a hard real-time system.</text>
  <text x="300" y="212" text-anchor="middle" font-size="10" fill="#5b6270">Example: a drone's stabilization loop missing its 5ms deadline can mean the vehicle flips before it corrects.</text>
</svg>
