<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <style>
    .detect { animation: detectpop 3s ease-in-out infinite; }
    @keyframes detectpop { 0%, 10% { opacity: 0; } 20%, 100% { opacity: 1; } }
    .d2 { animation-delay: -1s; }
    .d3 { animation-delay: -2s; }
  </style>

  <text x="280" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d23">Object Detection: Localized, Multi-Object Labels</text>

  <rect x="40" y="45" width="480" height="240" fill="#eef1f6" stroke="#1a1d23" stroke-width="2"/>

  <rect x="70" y="90" width="130" height="150" fill="#dde6f0" stroke="#1a1d23" stroke-width="1"/>
  <ellipse cx="330" cy="200" rx="110" ry="45" fill="#dde6f0" stroke="#1a1d23" stroke-width="1"/>
  <circle cx="450" cy="100" r="24" fill="#dde6f0" stroke="#1a1d23" stroke-width="1"/>

  <g class="detect">
    <rect x="65" y="85" width="140" height="160" fill="none" stroke="#e03131" stroke-width="2.5"/>
    <rect x="65" y="70" width="115" height="20" fill="#e03131"/>
    <text x="70" y="85" font-size="10.5" fill="#ffffff" font-weight="700">person 0.94</text>
  </g>

  <g class="detect d2">
    <rect x="220" y="150" width="220" height="100" fill="none" stroke="#2f9e44" stroke-width="2.5"/>
    <rect x="220" y="132" width="90" height="20" fill="#2f9e44"/>
    <text x="225" y="147" font-size="10.5" fill="#ffffff" font-weight="700">car 0.88</text>
  </g>

  <g class="detect d3">
    <rect x="422" y="72" width="56" height="56" fill="none" stroke="#f08c00" stroke-width="2.5"/>
    <rect x="422" y="56" width="95" height="18" fill="#f08c00"/>
    <text x="426" y="70" font-size="9.5" fill="#ffffff" font-weight="700">traffic sign 0.81</text>
  </g>

  <text x="280" y="305" text-anchor="middle" font-size="10.5" fill="#5b6270">Each box is its own class label, confidence score, and location — all in one frame.</text>
</svg>
