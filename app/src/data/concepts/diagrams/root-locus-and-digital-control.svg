<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <style>
    .locusdot { animation: movealong 3s ease-in-out infinite; offset-path: path('M90,180 Q170,110 270,60'); }
    @keyframes movealong {
      0% { offset-distance: 0%; fill: #2f9e44; }
      55% { offset-distance: 55%; fill: #f08c00; }
      100% { offset-distance: 100%; fill: #e03131; }
    }
  </style>

  <text x="240" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d23">Root Locus: Pole Path as Gain K Increases</text>

  <rect x="30" y="45" width="220" height="220" fill="#d3f9d8"/>
  <rect x="250" y="45" width="150" height="220" fill="#ffe3e3"/>
  <line x1="250" y1="45" x2="250" y2="265" stroke="#1a1d23" stroke-width="2"/>
  <line x1="30" y1="180" x2="400" y2="180" stroke="#1a1d23" stroke-width="2"/>
  <text x="405" y="184" font-size="11" fill="#5b6270">Re</text>
  <text x="245" y="40" font-size="11" fill="#5b6270">Im</text>

  <text x="60" y="255" font-size="10.5" font-weight="700" fill="#2f9e44">stable region</text>
  <text x="290" y="255" font-size="10.5" font-weight="700" fill="#e03131">unstable region</text>

  <text x="70" y="200" font-size="16" font-weight="700" fill="#5b6270">&#10005;</text>
  <text x="60" y="205" font-size="10" fill="#5b6270">K=0</text>

  <path d="M90,180 Q170,110 270,60" fill="none" stroke="#adb5bd" stroke-width="1.6" stroke-dasharray="4 3"/>
  <circle r="7" class="locusdot"/>

  <text x="240" y="288" text-anchor="middle" font-size="10.5" fill="#5b6270">As K rises the pole moves right &#8212; crossing the axis means instability.</text>
</svg>
