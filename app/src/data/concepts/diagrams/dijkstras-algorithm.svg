<svg viewBox="0 0 480 315" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <style>
    .ripple { animation: ripple 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ripple { 0% { r: 5; opacity: 0.9; } 100% { r: 200; opacity: 0; } }
  </style>

  <text x="240" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d23">Dijkstra: Uniform Outward Expansion</text>

  <clipPath id="dijkstraClip"><rect x="40" y="50" width="400" height="220"/></clipPath>
  <g clip-path="url(#dijkstraClip)">
    <rect x="40" y="50" width="400" height="220" fill="none" stroke="#dde1e8" stroke-width="1.5"/>
    <circle cx="90" cy="160" r="5" fill="none" stroke="#4dabf7" stroke-width="3" class="ripple" style="animation-delay:0s"/>
    <circle cx="90" cy="160" r="5" fill="none" stroke="#4dabf7" stroke-width="3" class="ripple" style="animation-delay:-0.8s"/>
    <circle cx="90" cy="160" r="5" fill="none" stroke="#4dabf7" stroke-width="3" class="ripple" style="animation-delay:-1.6s"/>
  </g>

  <circle cx="90" cy="160" r="7" fill="#1a1d23"/>
  <text x="65" y="185" font-size="10.5" fill="#1a1d23" font-weight="700">start</text>

  <circle cx="390" cy="80" r="8" fill="#e03131"/>
  <text x="360" y="65" font-size="10.5" fill="#e03131" font-weight="700">goal</text>

  <text x="240" y="288" text-anchor="middle" font-size="10" fill="#5b6270">Explores every direction equally — reaches the goal only</text>
  <text x="240" y="300" text-anchor="middle" font-size="10" fill="#5b6270">after covering a wide surrounding area.</text>
</svg>
