<svg viewBox="0 0 500 320" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <style>
    .ping { animation: ping 2.4s ease-in-out infinite; }
    @keyframes ping { 0%, 100% { opacity: 1; r: 4; } 50% { opacity: 0.3; r: 6; } }
  </style>

  <text x="250" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d23">2D LiDAR Scan &#8594; Point Cloud</text>

  <path d="M60,60 H440 V280 H60 Z" fill="none" stroke="#1a1d23" stroke-width="3"/>
  <path d="M60,60 H240 V150 H320 V280" fill="none" stroke="#1a1d23" stroke-width="3"/>

  <line x1="250" y1="200" x2="410" y2="200" stroke="#f08c00" stroke-width="2" opacity="0.75">
    <animateTransform attributeName="transform" type="rotate" from="0 250 200" to="360 250 200" dur="3s" repeatCount="indefinite"/>
  </line>

  <circle cx="250" cy="200" r="8" fill="#2f6fae"/>
  <text x="258" y="196" font-size="10.5" font-weight="700" fill="#2f6fae">robot / LiDAR</text>

  <g stroke="#adb5bd" stroke-width="1" stroke-dasharray="2 2">
    <line x1="250" y1="200" x2="250" y2="60"/>
    <line x1="250" y1="200" x2="130" y2="60"/>
    <line x1="250" y1="200" x2="380" y2="150"/>
    <line x1="250" y1="200" x2="440" y2="200"/>
    <line x1="250" y1="200" x2="320" y2="280"/>
    <line x1="250" y1="200" x2="150" y2="280"/>
    <line x1="250" y1="200" x2="60" y2="150"/>
    <line x1="250" y1="200" x2="90" y2="90"/>
  </g>
  <g fill="#e03131">
    <circle cx="250" cy="60" r="4" class="ping" style="animation-delay:0s"/><circle cx="130" cy="60" r="4" class="ping" style="animation-delay:-0.3s"/><circle cx="380" cy="150" r="4" class="ping" style="animation-delay:-0.6s"/>
    <circle cx="440" cy="200" r="4" class="ping" style="animation-delay:-0.9s"/><circle cx="320" cy="280" r="4" class="ping" style="animation-delay:-1.2s"/><circle cx="150" cy="280" r="4" class="ping" style="animation-delay:-1.5s"/>
    <circle cx="60" cy="150" r="4" class="ping" style="animation-delay:-1.8s"/><circle cx="90" cy="90" r="4" class="ping" style="animation-delay:-2.1s"/>
  </g>

  <text x="250" y="305" text-anchor="middle" font-size="11" fill="#5b6270">Each red dot is one range+angle measurement, converted to an (x, y) point.</text>
</svg>
