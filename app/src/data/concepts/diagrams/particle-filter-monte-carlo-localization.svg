<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <style>
    .die { animation: diefade 2.2s ease-in-out infinite; }
    @keyframes diefade { 0%, 40% { opacity: 0.75; } 55%, 100% { opacity: 0.05; } }
    .survive { animation: survivepulse 1.8s ease-in-out infinite; }
    @keyframes survivepulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
  </style>

  <text x="150" y="24" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1d23">Before: scattered particles</text>
  <rect x="30" y="45" width="260" height="200" rx="8" fill="none" stroke="#dde1e8" stroke-width="1.5"/>
  <g fill="#4dabf7">
    <circle cx="60" cy="70" r="3.5" class="die"/><circle cx="90" cy="110" r="3.5" class="die" style="animation-delay:-0.3s"/><circle cx="120" cy="60" r="3.5" class="die" style="animation-delay:-0.6s"/>
    <circle cx="150" cy="140" r="3.5" class="survive"/><circle cx="180" cy="90" r="3.5" class="die" style="animation-delay:-0.9s"/><circle cx="210" cy="160" r="3.5" class="die" style="animation-delay:-1.2s"/>
    <circle cx="240" cy="70" r="3.5" class="die" style="animation-delay:-1.5s"/><circle cx="70" cy="180" r="3.5" class="die" style="animation-delay:-1.8s"/><circle cx="110" cy="210" r="3.5" class="die" style="animation-delay:-0.2s"/>
    <circle cx="160" cy="200" r="3.5" class="survive" style="animation-delay:-0.5s"/><circle cx="200" cy="220" r="3.5" class="die" style="animation-delay:-0.8s"/><circle cx="260" cy="150" r="3.5" class="die" style="animation-delay:-1.1s"/>
    <circle cx="45" cy="130" r="3.5" class="die" style="animation-delay:-1.4s"/><circle cx="270" cy="200" r="3.5" class="die" style="animation-delay:-1.7s"/><circle cx="130" cy="100" r="3.5" class="survive" style="animation-delay:-0.4s"/>
    <circle cx="220" cy="110" r="3.5" class="die" style="animation-delay:-0.7s"/><circle cx="80" cy="230" r="3.5" class="die" style="animation-delay:-1s"/><circle cx="250" cy="230" r="3.5" class="die" style="animation-delay:-1.3s"/>
  </g>
  <circle cx="150" cy="145" r="8" fill="#e03131" opacity="0.9"/>
  <text x="150" y="270" text-anchor="middle" font-size="10.5" fill="#5b6270">low-weight particles fade out, resampled away</text>

  <path d="M300,145 h40" stroke="#1a1d23" stroke-width="2.5"/>
  <polygon points="340,139 354,145 340,151" fill="#1a1d23"/>

  <text x="490" y="24" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f9e44">After: converged on true position</text>
  <rect x="360" y="45" width="260" height="200" rx="8" fill="none" stroke="#dde1e8" stroke-width="1.5"/>
  <g fill="#2f9e44" opacity="0.85">
    <circle cx="478" cy="140" r="3.5"/><circle cx="484" cy="145" r="3.5"/><circle cx="490" cy="138" r="3.5"/>
    <circle cx="482" cy="150" r="3.5"/><circle cx="495" cy="148" r="3.5"/><circle cx="488" cy="155" r="3.5"/>
    <circle cx="475" cy="150" r="3.5"/><circle cx="498" cy="142" r="3.5"/><circle cx="480" cy="135" r="3.5"/>
  </g>
  <circle cx="486" cy="145" r="8" fill="#e03131" opacity="0.9"/>
  <text x="490" y="270" text-anchor="middle" font-size="10.5" fill="#2f9e44">particles cluster tightly around the true state</text>
</svg>
