<svg viewBox="0 0 560 280" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <style>
    .bar1 { animation: growbar1 3s ease-in-out infinite; }
    @keyframes growbar1 { 0%, 10% { height: 0px; y: 230px; } 30%, 100% { height: 25px; y: 205px; } }
    .bar2 { animation: growbar2 3s ease-in-out infinite; }
    @keyframes growbar2 { 0%, 25% { height: 0px; y: 230px; } 45%, 100% { height: 140px; y: 90px; } }
    .bar3 { animation: growbar3 3s ease-in-out infinite; }
    @keyframes growbar3 { 0%, 25% { height: 0px; y: 230px; } 45%, 100% { height: 140px; y: 90px; } }
    .bar4 { animation: growbar4 3s ease-in-out infinite; }
    @keyframes growbar4 { 0%, 45% { height: 0px; y: 230px; } 60%, 100% { height: 15px; y: 215px; } }
    .bartotal { animation: growtotal 3s ease-in-out infinite; }
    @keyframes growtotal { 0%, 65% { height: 0px; y: 230px; } 90%, 100% { height: 170px; y: 60px; } }
  </style>

  <text x="280" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d23">A Simple Power Budget (Worst-Case Current)</text>

  <line x1="70" y1="230" x2="520" y2="230" stroke="#1a1d23" stroke-width="2"/>
  <line x1="70" y1="230" x2="70" y2="50" stroke="#1a1d23" stroke-width="2"/>
  <text x="30" y="55" font-size="10.5" fill="#5b6270">mA</text>

  <rect x="95" y="205" width="50" height="25" fill="#4dabf7" class="bar1"/>
  <text x="120" y="245" text-anchor="middle" font-size="9.5" fill="#1a1d23">Arduino</text>

  <rect x="170" y="90" width="50" height="140" fill="#e03131" class="bar2"/>
  <text x="195" y="245" text-anchor="middle" font-size="9.5" fill="#1a1d23">Motor 1</text>
  <text x="195" y="82" text-anchor="middle" font-size="9" fill="#e03131" font-weight="700">stall</text>

  <rect x="245" y="90" width="50" height="140" fill="#e03131" class="bar3"/>
  <text x="270" y="245" text-anchor="middle" font-size="9.5" fill="#1a1d23">Motor 2</text>
  <text x="270" y="82" text-anchor="middle" font-size="9" fill="#e03131" font-weight="700">stall</text>

  <rect x="320" y="215" width="50" height="15" fill="#f08c00" class="bar4"/>
  <text x="345" y="245" text-anchor="middle" font-size="9.5" fill="#1a1d23">Sensors</text>

  <rect x="420" y="60" width="70" height="170" fill="#2f9e44" opacity="0.85" class="bartotal"/>
  <text x="455" y="245" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1d23">TOTAL</text>

  <text x="280" y="265" text-anchor="middle" font-size="10.5" fill="#5b6270">Every component's worst-case draw is added, never assumed away.</text>
</svg>
