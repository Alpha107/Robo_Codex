<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <text x="240" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d23">2-DOF Planar Arm &amp; Its Workspace</text>

  <circle cx="240" cy="180" r="220" fill="none" stroke="#4dabf7" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="240" cy="180" r="40" fill="none" stroke="#4dabf7" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M 20,180 A220,220 0 0 1 460,180 A220,220 0 0 1 20,180 Z M 200,180 A40,40 0 0 1 280,180 A40,40 0 0 1 200,180 Z" fill="#d0ebff" fill-rule="evenodd" opacity="0.55"/>

  <circle cx="240" cy="180" r="6" fill="#1a1d23"/>
  <line x1="240" y1="180" x2="330" y2="110" stroke="#1a1d23" stroke-width="6" stroke-linecap="round"/>
  <circle cx="330" cy="110" r="6" fill="#1a1d23"/>
  <line x1="330" y1="110" x2="420" y2="180" stroke="#5b6270" stroke-width="6" stroke-linecap="round"/>
  <circle cx="420" cy="180" r="7" fill="#e03131"/>

  <text x="245" y="200" font-size="10.5" fill="#1a1d23">joint 1</text>
  <text x="335" y="100" font-size="10.5" fill="#1a1d23">joint 2</text>
  <text x="428" y="185" font-size="10.5" fill="#e03131" font-weight="700">end-effector</text>

  <text x="460" y="90" font-size="11" font-weight="700" fill="#1c7ed6">outer boundary:</text>
  <text x="460" y="105" font-size="10.5" fill="#5b6270">both links fully extended</text>
  <text x="285" y="185" font-size="10" font-weight="700" fill="#1c7ed6">inner hole:</text>
  <text x="270" y="230" font-size="10" fill="#5b6270">links folded onto each other</text>

  <circle r="6" fill="#f08c00">
    <animateMotion dur="6s" repeatCount="indefinite" path="M 460,180 A220,220 0 0 1 20,180 A220,220 0 0 1 460,180"/>
  </circle>
  <circle r="5" fill="#2f9e44">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 280,180 A40,40 0 0 1 200,180 A40,40 0 0 1 280,180"/>
  </circle>

  <rect x="30" y="260" width="560" height="46" rx="8" fill="#f4f6f9" stroke="#dde1e8" stroke-width="1.4"/>
  <text x="310" y="278" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a1d23">Example: a 4-DOF hobby arm adds a 3rd/4th joint mainly to reach the</text>
  <text x="310" y="292" text-anchor="middle" font-size="10.5" fill="#5b6270">same points from more angles, not to enlarge this reachable region much.</text>
</svg>
