<svg viewBox="0 0 600 280" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <style>
    .roll { animation: rolltranslate 2.4s linear infinite; }
    @keyframes rolltranslate { from { transform: translateX(0); } to { transform: translateX(90px); } }
    .spin { animation: spinrot 0.7s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spinrot { to { transform: rotate(360deg); } }
    .smoke { animation: smokeflicker 0.6s ease-in-out infinite alternate; }
    @keyframes smokeflicker { from { opacity: 0.25; } to { opacity: 0.7; } }
  </style>

  <text x="150" y="24" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f9e44">Within friction limit: rolls</text>
  <line x1="30" y1="220" x2="270" y2="220" stroke="#1a1d23" stroke-width="2"/>
  <g class="roll">
    <circle cx="80" cy="195" r="26" fill="#5b6270" stroke="#1a1d23" stroke-width="2"/>
    <line x1="80" y1="195" x2="80" y2="172" stroke="#1a1d23" stroke-width="3"/>
    <line x1="80" y1="195" x2="100" y2="205" stroke="#1a1d23" stroke-width="3"/>
  </g>
  <text x="150" y="250" text-anchor="middle" font-size="10.5" fill="#2f9e44">rotation converts cleanly into travel</text>

  <line x1="300" y1="0" x2="300" y2="280" stroke="#dde1e8" stroke-width="1.5"/>

  <text x="450" y="24" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e03131">Past friction limit: slips</text>
  <line x1="330" y1="220" x2="570" y2="220" stroke="#1a1d23" stroke-width="2"/>
  <circle cx="450" cy="195" r="26" fill="#5b6270" stroke="#1a1d23" stroke-width="2" class="spin"/>
  <line x1="450" y1="195" x2="450" y2="172" stroke="#1a1d23" stroke-width="3" class="spin"/>
  <g class="smoke" stroke="#adb5bd" stroke-width="1.6" fill="none">
    <path d="M420,222 q-8,-10 -2,-18"/>
    <path d="M435,225 q-6,-12 2,-20"/>
    <path d="M465,225 q6,-12 -2,-20"/>
    <path d="M480,222 q8,-10 2,-18"/>
  </g>
  <text x="450" y="250" text-anchor="middle" font-size="10.5" fill="#e03131">wheel spins in place &#8212; robot doesn't move</text>
</svg>
