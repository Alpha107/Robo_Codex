<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <text x="310" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d23">Inverse Kinematics: same target, two valid solutions</text>

  <circle cx="120" cy="230" r="6" fill="#1a1d23"/>
  <text x="105" y="252" font-size="10.5" fill="#5b6270">base</text>

  <line x1="120" y1="230" x2="260" y2="140" stroke="#2f9e44" stroke-width="7" stroke-linecap="round">
    <animate attributeName="x2" values="260;340;300;260" keyTimes="0;0.4;0.75;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="140;110;235;140" keyTimes="0;0.4;0.75;1" dur="4s" repeatCount="indefinite"/>
  </line>
  <circle cx="260" cy="140" r="6" fill="#2f9e44">
    <animate attributeName="cx" values="260;340;300;260" keyTimes="0;0.4;0.75;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="140;110;235;140" keyTimes="0;0.4;0.75;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <line x1="260" y1="140" x2="400" y2="200" stroke="#2f9e44" stroke-width="7" stroke-linecap="round" opacity="0.85">
    <animate attributeName="x1" values="260;340;300;260" keyTimes="0;0.4;0.75;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y1" values="140;110;235;140" keyTimes="0;0.4;0.75;1" dur="4s" repeatCount="indefinite"/>
  </line>

  <text x="240" y="120" font-size="11" font-weight="700" fill="#2f9e44">elbow swings between solutions &#8212;</text>
  <text x="240" y="264" font-size="11" font-weight="700" fill="#2f9e44">end-effector never moves</text>

  <circle cx="400" cy="200" r="9" fill="#e03131"/>
  <text x="412" y="196" font-size="12" font-weight="700" fill="#e03131">target (x, y)</text>

  <text x="310" y="285" text-anchor="middle" font-size="11" fill="#5b6270">Both configurations place the end-effector at the exact same point — either is a valid IK solution.</text>
</svg>
