<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <style>
    .recede { animation: recedehorizon 3.2s steps(4) infinite; }
    @keyframes recedehorizon { 0% { transform: translateX(0); opacity: 1; } 90% { transform: translateX(70px); opacity: 1; } 100% { transform: translateX(70px); opacity: 0; } }
  </style>

  <line x1="40" y1="220" x2="660" y2="220" stroke="#1a1d23" stroke-width="2"/>
  <text x="655" y="240" text-anchor="end" font-size="11" fill="#5b6270">time</text>

  <text x="500" y="20" font-size="11" fill="#5b6270">reference target &#8594;</text>
  <line x1="400" y1="30" x2="660" y2="30" stroke="#f08c00" stroke-width="2" stroke-dasharray="3 3"/>

  <g class="recede">
    <line x1="180" y1="30" x2="180" y2="220" stroke="#1a1d23" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="180" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1d23">now</text>

    <rect x="180" y="30" width="220" height="190" fill="#e7f5ff" opacity="0.6"/>
    <text x="290" y="45" text-anchor="middle" font-size="11" font-weight="700" fill="#1c7ed6">prediction horizon (N steps)</text>

    <path d="M180,180 Q260,120 400,90" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="4 3"/>
    <path d="M180,180 Q260,160 400,150" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="4 3"/>
    <path d="M180,180 Q260,140 400,110" fill="none" stroke="#2f9e44" stroke-width="3"/>
    <text x="405" y="108" font-size="10.5" font-weight="700" fill="#2f9e44">chosen (optimal) plan</text>
    <text x="405" y="152" font-size="10.5" fill="#adb5bd">rejected candidates</text>

    <path d="M180,180 Q205,168 240,155" fill="none" stroke="#e03131" stroke-width="4"/>
  </g>

  <text x="200" y="235" text-anchor="middle" font-size="10.5" font-weight="700" fill="#e03131">only the first step is ever applied</text>

  <path d="M400,240 q40,20 80,0" fill="none" stroke="#845ef7" stroke-width="2"/>
  <polygon points="474,236 484,240 474,244" fill="#845ef7"/>
  <text x="440" y="258" text-anchor="middle" font-size="10.5" font-weight="700" fill="#845ef7">re-optimize at next step</text>

  <rect x="60" y="266" width="590" height="26" rx="6" fill="#f4f6f9" stroke="#dde1e8" stroke-width="1.2"/>
  <text x="355" y="284" text-anchor="middle" font-size="10.5" fill="#5b6270">Example: a self-driving car re-plans its next few seconds of trajectory ~10&#8211;50 times per second</text>
</svg>
