<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <style>
    .beat { animation: beat 1.3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes beat { 0%, 100% { transform: scale(0.8); opacity: 0.6; } 50% { transform: scale(1.25); opacity: 1; } }
    .beat2 { animation-delay: -0.3s; }
    .beat3 { animation-delay: -0.6s; }
  </style>

  <text x="150" y="24" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1d23">EKF: linearize with a tangent line</text>
  <line x1="40" y1="230" x2="280" y2="230" stroke="#dde1e8" stroke-width="1.5"/>
  <line x1="40" y1="230" x2="40" y2="60" stroke="#dde1e8" stroke-width="1.5"/>
  <path d="M40,220 Q140,220 180,100 Q200,50 260,60" fill="none" stroke="#4dabf7" stroke-width="2.5"/>
  <circle cx="180" cy="112" r="6" fill="#e03131" class="beat"/>
  <line x1="120" y1="180" x2="240" y2="70" stroke="#f08c00" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="185" y="100" font-size="10.5" font-weight="700" fill="#e03131">current estimate</text>
  <text x="60" y="250" font-size="10" fill="#f08c00">tangent line approximation</text>

  <line x1="320" y1="0" x2="320" y2="320" stroke="#dde1e8" stroke-width="1.5"/>

  <text x="480" y="24" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1d23">UKF: sample the true curve</text>
  <line x1="360" y1="230" x2="600" y2="230" stroke="#dde1e8" stroke-width="1.5"/>
  <line x1="360" y1="230" x2="360" y2="60" stroke="#dde1e8" stroke-width="1.5"/>
  <path d="M360,220 Q460,220 500,100 Q520,50 580,60" fill="none" stroke="#4dabf7" stroke-width="2.5"/>
  <circle cx="440" cy="188" r="5" fill="#2f9e44" class="beat"/>
  <circle cx="500" cy="102" r="5" fill="#2f9e44" class="beat beat2"/>
  <circle cx="530" cy="70" r="5" fill="#2f9e44" class="beat beat3"/>
  <text x="440" y="270" font-size="10" fill="#2f9e44" font-weight="700">sigma points evaluated on real curve</text>

  <rect x="40" y="285" width="560" height="30" rx="8" fill="#f4f6f9" stroke="#dde1e8" stroke-width="1.4"/>
  <text x="320" y="304" text-anchor="middle" font-size="10.5" fill="#5b6270">Example: estimating heading from a range+bearing landmark sighting needs exactly this nonlinear handling</text>
</svg>
