<svg viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <text x="280" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d23">Small Fast Gear &#8594; Large Slow Gear</text>

  <g transform="translate(140,140)">
    <circle r="45" fill="none" stroke="#2f6fae" stroke-width="10" stroke-dasharray="6 6"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="45" y2="0" stroke="#1a1d23" stroke-width="2.5"/>
      <line x1="0" y1="0" x2="0" y2="-45" stroke="#1a1d23" stroke-width="2.5"/>
    </g>
    <circle r="6" fill="#1a1d23"/>
  </g>
  <text x="140" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#2f6fae">driving gear</text>
  <text x="140" y="225" text-anchor="middle" font-size="10.5" fill="#5b6270">fast, low torque</text>

  <g transform="translate(390,140)">
    <circle r="95" fill="none" stroke="#f08c00" stroke-width="10" stroke-dasharray="8 8"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2.9s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="90" y2="0" stroke="#1a1d23" stroke-width="2.5"/>
      <line x1="0" y1="0" x2="0" y2="-90" stroke="#1a1d23" stroke-width="2.5"/>
    </g>
    <circle r="6" fill="#1a1d23"/>
  </g>
  <text x="390" y="30" text-anchor="middle" font-size="11" font-weight="700" fill="#f08c00">driven gear</text>
  <text x="390" y="252" text-anchor="middle" font-size="10.5" fill="#5b6270">slow, high torque</text>

  <path d="M186,140 h130" stroke="#1a1d23" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="250" y="130" text-anchor="middle" font-size="9.5" fill="#5b6270">meshed &#8212; opposite spin directions</text>
</svg>
