<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <style>
    .explore { animation: explorepulse 2s ease-in-out infinite; }
    @keyframes explorepulse { 0%, 100% { opacity: 0.15; } 50% { opacity: 1; } }
  </style>

  <text x="240" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d23">A*: Goal-Directed Expansion</text>

  <rect x="40" y="50" width="400" height="220" fill="none" stroke="#dde1e8" stroke-width="1.5"/>
  <path d="M90,160 Q220,90 390,80 L390,80 Q220,120 90,160 Z" fill="#a5d8ff" opacity="0.5"/>
  <path d="M90,160 Q230,105 390,80 L390,80 Q230,135 90,160 Z" fill="#4dabf7" opacity="0.6"/>

  <g fill="#1c7ed6">
    <circle cx="140" cy="140" r="4" class="explore" style="animation-delay:0s"/>
    <circle cx="190" cy="122" r="4" class="explore" style="animation-delay:-0.3s"/>
    <circle cx="240" cy="108" r="4" class="explore" style="animation-delay:-0.6s"/>
    <circle cx="290" cy="96" r="4" class="explore" style="animation-delay:-0.9s"/>
    <circle cx="340" cy="87" r="4" class="explore" style="animation-delay:-1.2s"/>
  </g>

  <circle cx="90" cy="160" r="7" fill="#1a1d23"/>
  <text x="65" y="185" font-size="10.5" fill="#1a1d23" font-weight="700">start</text>

  <circle cx="390" cy="80" r="8" fill="#e03131"/>
  <text x="360" y="65" font-size="10.5" fill="#e03131" font-weight="700">goal</text>

  <path d="M90,160 Q230,110 390,80" fill="none" stroke="#2f9e44" stroke-width="3" stroke-dasharray="6 4"/>

  <text x="240" y="288" text-anchor="middle" font-size="10.5" fill="#5b6270">The heuristic keeps exploration in a narrow corridor pointed toward the goal.</text>
</svg>
