<svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <style>
    .fall { animation: fallpulse 1.6s ease-in-out infinite; }
    @keyframes fallpulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    .meterfill { animation: meter 2.4s ease-in-out infinite; }
    @keyframes meter { 0%, 100% { height: 14px; y: 246px; } 50% { height: 46px; y: 214px; } }
  </style>

  <text x="300" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d23">Torque Needed to Hold a Single Arm Against Gravity</text>

  <circle cx="150" cy="230" r="7" fill="#1a1d23"/>
  <text x="130" y="255" font-size="11" fill="#5b6270">joint</text>
  <line x1="150" y1="230" x2="320" y2="140" stroke="#5b6270" stroke-width="8" stroke-linecap="round"/>
  <circle cx="320" cy="140" r="8" fill="#e03131"/>
  <text x="325" y="130" font-size="11" font-weight="700" fill="#e03131">center of mass (m)</text>

  <path d="M320,140 v50" stroke="#1a1d23" stroke-width="2" class="fall"/>
  <polygon points="314,180 320,195 326,180" fill="#1a1d23" class="fall"/>
  <text x="330" y="185" font-size="11" fill="#1a1d23">mg (gravity)</text>

  <path d="M150,205 A28,28 0 0 1 178,222" fill="none" stroke="#f08c00" stroke-width="1.8"/>
  <text x="160" y="200" font-size="11" font-weight="700" fill="#f08c00">&#952;</text>

  <path d="M120,240 a35,35 0 1 1 20,20" fill="none" stroke="#2f6fae" stroke-width="2.5"/>
  <polygon points="132,266 138,258 145,268" fill="#2f6fae"/>
  <text x="90" y="285" font-size="11" font-weight="700" fill="#2f6fae">&#964; (required joint torque)</text>

  <rect x="440" y="150" width="24" height="110" fill="none" stroke="#1a1d23" stroke-width="1.6"/>
  <rect x="441" y="246" width="22" height="14" fill="#2f6fae" class="meterfill"/>
  <text x="452" y="140" text-anchor="middle" font-size="10" fill="#5b6270">&#964; meter</text>

  <rect x="30" y="295" width="540" height="34" rx="8" fill="#f4f6f9" stroke="#dde1e8" stroke-width="1.4"/>
  <text x="300" y="317" text-anchor="middle" font-size="10.5" fill="#5b6270">Example: m=0.5kg, L=0.2m, &#952;=30&#176; &#8594; &#964;=m&#183;g&#183;L&#183;cos&#952; &#8776; 0.85 N&#183;m just to hold position</text>
</svg>
