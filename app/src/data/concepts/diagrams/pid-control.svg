<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <style>
    .fwd { stroke-dasharray: 6 5; animation: fwdflow 1s linear infinite; }
    @keyframes fwdflow { to { stroke-dashoffset: -22; } }
    .fb { stroke-dasharray: 6 4; animation: fbflow 1.4s linear infinite; }
    @keyframes fbflow { to { stroke-dashoffset: -20; } }
    .glow { animation: glowpulse 1.2s ease-in-out infinite; }
    @keyframes glowpulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
  </style>

  <text x="15" y="115" font-size="13" font-weight="700" fill="#1a1d23">Setpoint</text>
  <text x="15" y="132" font-size="12" fill="#5b6270">r(t)</text>
  <path d="M75,122 H118" stroke="#1a1d23" stroke-width="2.5" fill="none" class="fwd"/>
  <polygon points="118,116 132,122 118,128" fill="#1a1d23"/>

  <circle cx="145" cy="122" r="16" fill="#ffffff" stroke="#1a1d23" stroke-width="2.5"/>
  <text x="145" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d23">+</text>
  <text x="145" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#e03131">&#8722;</text>

  <path d="M161,122 H204" stroke="#1a1d23" stroke-width="2.5" fill="none" class="fwd"/>
  <polygon points="204,116 218,122 204,128" fill="#1a1d23"/>
  <text x="182" y="108" text-anchor="middle" font-size="11" fill="#5b6270">e(t)</text>

  <rect x="218" y="87" width="150" height="70" rx="8" fill="#2f6fae" stroke="#1a1d23" stroke-width="2" class="glow"/>
  <text x="293" y="116" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">PID</text>
  <text x="293" y="133" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">Controller</text>
  <text x="293" y="149" text-anchor="middle" fill="#d0e8ff" font-size="10">Kp, Ki, Kd</text>

  <path d="M368,122 H411" stroke="#1a1d23" stroke-width="2.5" fill="none" class="fwd"/>
  <polygon points="411,116 425,122 411,128" fill="#1a1d23"/>
  <text x="390" y="108" text-anchor="middle" font-size="11" fill="#5b6270">u(t)</text>

  <rect x="425" y="87" width="145" height="70" rx="8" fill="#8d6e63" stroke="#1a1d23" stroke-width="2"/>
  <text x="497" y="116" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Plant</text>
  <text x="497" y="133" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">(System)</text>
  <text x="497" y="149" text-anchor="middle" fill="#f0e4dc" font-size="10">motor + robot</text>

  <path d="M570,122 H585" stroke="#1a1d23" stroke-width="2.5" fill="none" class="fwd"/>
  <text x="592" y="115" font-size="13" font-weight="700" fill="#1a1d23">Output</text>
  <text x="592" y="132" font-size="12" fill="#5b6270">y(t)</text>

  <path d="M578,122 V210 H145 V138" fill="none" stroke="#51cf66" stroke-width="2.5" class="fb"/>
  <polygon points="139,144 145,130 151,144" fill="#51cf66"/>
  <text x="360" y="228" text-anchor="middle" font-size="12" font-weight="600" fill="#2f9e44">measured feedback (sensor reading)</text>

  <text x="330" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d23">Closed-Loop PID Control</text>

  <rect x="60" y="250" width="560" height="55" rx="8" fill="#f4f6f9" stroke="#dde1e8" stroke-width="1.4"/>
  <text x="340" y="272" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1d23">Example: robot arm joint held at 90&#176;</text>
  <text x="340" y="290" text-anchor="middle" font-size="11" fill="#5b6270">r(t)=90&#176;, currently at 75&#176; &#8594; e(t)=15&#176; &#8594; PID drives the motor &#8594; error shrinks toward 0&#176;</text>
</svg>
