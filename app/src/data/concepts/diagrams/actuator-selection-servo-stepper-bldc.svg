<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <style>
    .servoarm { animation: servosweep 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
    @keyframes servosweep { 0%, 100% { transform: rotate(-55deg); } 50% { transform: rotate(55deg); } }
    .stepperarm { animation: steptick 2s steps(8) infinite; transform-box: fill-box; transform-origin: bottom center; }
    @keyframes steptick { to { transform: rotate(360deg); } }
    .bldcblade { animation: bldcspin 0.4s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes bldcspin { to { transform: rotate(360deg); } }
  </style>

  <text x="103" y="24" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4dabf7">Servo</text>
  <line x1="103" y1="230" x2="103" y2="140" stroke="#1a1d23" stroke-width="6" stroke-linecap="round" class="servoarm"/>
  <circle cx="103" cy="230" r="8" fill="#1a1d23"/>
  <path d="M60,230 A43,43 0 0 1 146,230" fill="none" stroke="#dde1e8" stroke-width="1.4" stroke-dasharray="3 3"/>
  <text x="103" y="260" text-anchor="middle" font-size="10" fill="#4dabf7">sweeps to &amp; holds an angle</text>

  <line x1="206" y1="0" x2="206" y2="300" stroke="#dde1e8" stroke-width="1.5"/>

  <text x="310" y="24" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f08c00">Stepper</text>
  <line x1="310" y1="230" x2="310" y2="140" stroke="#1a1d23" stroke-width="6" stroke-linecap="round" class="stepperarm"/>
  <circle cx="310" cy="230" r="8" fill="#1a1d23"/>
  <text x="310" y="260" text-anchor="middle" font-size="10" fill="#f08c00">advances in fixed discrete steps</text>

  <line x1="413" y1="0" x2="413" y2="300" stroke="#dde1e8" stroke-width="1.5"/>

  <text x="516" y="24" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e03131">BLDC</text>
  <g class="bldcblade">
    <line x1="516" y1="185" x2="516" y2="135" stroke="#1a1d23" stroke-width="7" stroke-linecap="round"/>
    <line x1="471" y1="185" x2="561" y2="185" stroke="#1a1d23" stroke-width="7" stroke-linecap="round"/>
  </g>
  <circle cx="516" cy="185" r="6" fill="#e03131"/>
  <text x="516" y="260" text-anchor="middle" font-size="10" fill="#e03131">spins continuously, fast</text>

  <text x="310" y="285" text-anchor="middle" font-size="10.5" fill="#5b6270">Pick the motion character the task actually needs, not the "best" motor in the abstract.</text>
</svg>
