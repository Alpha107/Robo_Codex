<svg viewBox="0 0 600 280" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <text x="300" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d23">Trapezoidal Velocity Profile</text>

  <line x1="60" y1="210" x2="560" y2="210" stroke="#1a1d23" stroke-width="2"/>
  <line x1="60" y1="210" x2="60" y2="50" stroke="#1a1d23" stroke-width="2"/>
  <text x="565" y="214" font-size="11" fill="#5b6270">time</text>
  <text x="35" y="55" font-size="11" fill="#5b6270">v</text>

  <path d="M60,210 Q120,205 180,90 Q290,60 400,90 Q470,205 520,210" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M60,210 L180,90 L400,90 L520,210" fill="none" stroke="#2f6fae" stroke-width="3"/>
  <circle r="6" fill="#e03131">
    <animateMotion dur="3s" repeatCount="indefinite" path="M60,210 L180,90 L400,90 L520,210"/>
  </circle>

  <text x="120" y="150" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2f6fae">accelerate</text>
  <text x="290" y="80" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2f6fae">cruise at v_max</text>
  <text x="460" y="150" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2f6fae">decelerate</text>
  <text x="290" y="45" text-anchor="middle" font-size="10" fill="#adb5bd">S-curve (jerk-limited) alternative, dashed</text>

  <line x1="180" y1="90" x2="180" y2="210" stroke="#adb5bd" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="400" y1="90" x2="400" y2="210" stroke="#adb5bd" stroke-width="1.2" stroke-dasharray="3 3"/>

  <text x="300" y="238" text-anchor="middle" font-size="10.5" fill="#5b6270">Respects real acceleration and top-speed limits instead of jumping instantly between speeds.</text>
  <text x="300" y="254" text-anchor="middle" font-size="10" fill="#5b6270">The dot traces a single axis's commanded speed over time, from a 3D printer's motion controller.</text>
</svg>
