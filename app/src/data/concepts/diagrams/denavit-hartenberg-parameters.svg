<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace">
  <style>
    .hl { animation: highlight 4.8s ease-in-out infinite; }
    @keyframes highlight { 0%, 8% { opacity: 1; } 25%, 100% { opacity: 0.3; } }
    .hl2 { animation-delay: -1.2s; }
    .hl3 { animation-delay: -2.4s; }
    .hl4 { animation-delay: -3.6s; }
  </style>

  <text x="310" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d23">DH Parameters Between Two Consecutive Joints</text>

  <line x1="150" y1="230" x2="150" y2="60" stroke="#2f6fae" stroke-width="3"/>
  <polygon points="144,66 150,52 156,66" fill="#2f6fae"/>
  <text x="158" y="60" font-size="12" font-weight="700" fill="#2f6fae">z(i-1)</text>

  <line x1="420" y1="220" x2="480" y2="80" stroke="#f08c00" stroke-width="3"/>
  <polygon points="475,92 486,80 481,96" fill="#f08c00"/>
  <text x="486" y="80" font-size="12" font-weight="700" fill="#f08c00">z(i)</text>

  <g class="hl">
    <path d="M150,150 H420" stroke="#2f9e44" stroke-width="3.5"/>
    <circle cx="150" cy="150" r="4" fill="#1a1d23"/>
    <circle cx="420" cy="150" r="4" fill="#1a1d23"/>
    <text x="280" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#2f9e44">a (link length)</text>
  </g>

  <g class="hl hl2">
    <path d="M175,150 A25,25 0 0 1 152,174" fill="none" stroke="#e03131" stroke-width="2.4"/>
    <text x="185" y="195" font-size="11" font-weight="700" fill="#e03131">&#952; (joint angle, about z(i-1))</text>
  </g>

  <g class="hl hl3">
    <path d="M150,150 V205" stroke="#845ef7" stroke-width="3" stroke-dasharray="5 4"/>
    <text x="10" y="185" font-size="11" font-weight="700" fill="#845ef7">d (offset along z(i-1))</text>
  </g>

  <g class="hl hl4">
    <path d="M400,175 q20,-30 45,-55" fill="none" stroke="#4dabf7" stroke-width="2.2"/>
    <text x="400" y="215" font-size="11" font-weight="700" fill="#4dabf7">&#945; (twist, about a)</text>
  </g>

  <text x="310" y="270" text-anchor="middle" font-size="10.5" fill="#5b6270">Four numbers (a, &#945;, d, &#952;) fully describe the</text>
  <text x="310" y="284" text-anchor="middle" font-size="10.5" fill="#5b6270">geometric step from one joint frame to the next.</text>
</svg>
